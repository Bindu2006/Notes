version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: notes_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - notes_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: notes_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=collaborative_notes
      - JWT_SECRET=super-secret-key-change-in-production-123456
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      - mongodb
    networks:
      - notes_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: notes_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - notes_network
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  notes_network:
    driver: bridge
