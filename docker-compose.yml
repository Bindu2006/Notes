services:
  mongodb:
    image: mongo:6.0
    container_name: notes_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - notes_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: notes_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - DATABASE_NAME=${DATABASE_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    depends_on:
      - mongodb
    networks:
      - notes_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: notes_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - notes_network
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  notes_network:
    driver: bridge
